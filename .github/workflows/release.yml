name: SDK Release

on:
  push:
    tags:
      - 'engine-sdk-v*'
      - 'data-sdk-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  prepare:
    name: Validate release tag
    if: github.repository == 'nuxus-org/nuxus-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.release.outputs.package }}
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate package, version, notes and main ancestry
        id: release
        run: node scripts/release.mjs prepare

  checks:
    name: Release validation
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish selected SDK to npm
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-${{ needs.prepare.outputs.package }}
      cancel-in-progress: false
    steps:
      - name: Check out tagged release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download verified package archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/sdk-packages

      - name: Publish verified archive using npm Trusted Publishing
        run: node scripts/release.mjs publish "$RUNNER_TEMP/sdk-packages"

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Create release from prepared notes
        run: node scripts/release.mjs github
        env:
          GH_TOKEN: ${{ github.token }}
