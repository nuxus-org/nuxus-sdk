name: SDK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  validate:
    name: Validate and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install pinned Gitleaks
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          printf '%s\n' "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: node scripts/check-secrets.mjs history

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check public types
        run: pnpm check-types

      - name: Test hooks and SDKs
        run: pnpm test

      - name: Pack SDKs
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-packages"
          pnpm --filter @nuxus/engine-sdk pack --out "$RUNNER_TEMP/sdk-packages/engine-sdk.tgz"
          pnpm --filter @nuxus/data-sdk pack --out "$RUNNER_TEMP/sdk-packages/data-sdk.tgz"

      - name: Validate packed exports, runtime and declarations
        run: pnpm check:packages "$RUNNER_TEMP/sdk-packages" --check-types

      - name: Upload verified package archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/sdk-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  node22:
    name: Packed SDKs on Node.js 22
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out consumer test tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Download verified package archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/sdk-packages

      - name: Test independently installed SDKs
        run: node scripts/check-packages.mjs "$RUNNER_TEMP/sdk-packages"
